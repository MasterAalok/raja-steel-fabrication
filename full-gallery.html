<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Gallery</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#0b0b0d;
      color:white;
      font-family:Arial;
      padding:40px 20px;
    }

    h1{
      text-align:center;
      margin-bottom:40px;
      font-size:42px;
    }

    .gallery-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:20px;
    }

    .gallery-grid img{
      width:100%;
      height:300px;
      object-fit:cover;
      border-radius:14px;
      transition:0.4s;
      cursor:pointer;
    }

    .gallery-grid img:hover{
      transform:scale(1.04);
    }

  </style>
</head>

<body>

  <h1>Our Full Project Gallery</h1>
